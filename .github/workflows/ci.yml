# Runs tests/run.sh (luacheck, the tests and the API check) on every push and pull request, before
# each release (release.yml calls it), and weekly: the API check reads Blizzard's live UI source, so a
# patch that changes an API Clicky calls fails it without anyone pushing.
name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
  schedule:
    - cron: '0 18 * * 2' # Tuesdays, 18:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # A change that makes a test loop forever fails in minutes, not after GitHub's six-hour default
    # (a tests/run.sh run takes under a minute on a Mac).
    timeout-minutes: 15
    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tests/check_toylist.py compares ToyList.lua with every release tag's from v1.0.0 on

      - name: Install LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install busted and luacheck
        run: luarocks install busted && luarocks install luacheck

      - name: Install lua-language-server
        run: |
          mkdir -p "$RUNNER_TEMP/luals"
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/luals"
          echo "$RUNNER_TEMP/luals/bin" >> "$GITHUB_PATH"

      - name: Run tests
        run: tests/run.sh
        env:
          BUSTED: busted
